[package]
name = "rustmc_core"
version = "0.10.0"
edition = "2021"
description = "Structure-aware Bayesian inference engine"
license = "MIT"
repository = "https://github.com/tbosier/rustmc"
homepage = "https://github.com/tbosier/rustmc"
documentation = "https://docs.rs/rustmc_core"
readme = "README.md"
keywords = ["bayesian", "inference", "mcmc", "statistics", "autodiff"]
categories = ["science", "algorithms"]

[dependencies]
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
ndarray = "0.16"
faer = { version = "0.19", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
