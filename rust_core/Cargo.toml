[package]
name = "rustmc_core"
version = "0.15.0"
edition = "2021"
# Set by the standard library, not by a dependency: `is_multiple_of` on unsigned
# integers is stable from 1.87. CI's `msrv` job checks this crate's library, tests
# and examples with exactly this toolchain, so a newer API cannot slip in
# unnoticed.
rust-version = "1.87"
description = "Structure-aware Bayesian inference engine"
license = "MIT"
repository = "https://github.com/tbosier/rustmc"
homepage = "https://github.com/tbosier/rustmc"
documentation = "https://docs.rs/rustmc_core"
readme = "README.md"
keywords = ["bayesian", "inference", "mcmc", "statistics", "autodiff"]
categories = ["science", "algorithms"]

[dependencies]
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
faer = { version = "0.19", features = ["rayon"] }
# The version faer 0.19 already depends on, used to run the narrow
# matrix-product loops with FMA enabled where the CPU has it.
pulp = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# Test-only. Compiles in hooks that deliberately break the NUTS kernel, so the
# exactness tests (rust_core/tests/exactness_power.rs) can show that they fail
# when the sampler is wrong. The hooks do nothing until a test selects a fault.
# Never enable this in a build anyone samples with.
fault-injection = []
