site_name: rustmc
site_description: Bayesian models in Python. Inference in Rust.
site_url: https://tbosier.github.io/rustmc
repo_url: https://github.com/tbosier/rustmc
repo_name: tbosier/rustmc

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Custom Models: custom-models.md
  - Streaming Batches: streaming-batches.md
  - Examples:
    - Repeated Calibration: examples/repeated-calibration.md
    - Site Effects: examples/site-effects.md
    - Linear Regression: examples/linear-regression.md
    - Hierarchical Models: examples/hierarchical.md
    - Hierarchical Templates: examples/hierarchical-templates.md
    - Batch Inference: examples/batch-inference.md
    - High-Dimensional Regression: examples/high-dimensional.md
  - API Reference: reference.md
  - Forecasting:
    - Evaluation and workflows: forecasting-workflows.md
    - Structural composition: structural-forecasting.md
    - Dynamic counts, amounts, and pooling: dynamic-glm.md
    - Regression and Fourier terms: regression-forecasting.md
    - Independent batches and diagnostics: forecast-batches.md
    - Sparse amounts: sparse-amounts.md
    - Payment-count runoff: runoff.md
  - Architecture:
    - Compiled models: architecture/compiled-model.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tbosier/rustmc
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/rustmc
