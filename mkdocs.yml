site_name: rustmc
site_description: Bayesian models in Python. Inference in Rust.
site_url: https://tbosier.github.io/rustmc
repo_url: https://github.com/tbosier/rustmc
repo_name: tbosier/rustmc

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Top-level nav entries become tabs; their children are grouped headings in
    # the sidebar rather than a single long expandable tree.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    # Update the address bar as the reader scrolls, so a link copied from a long
    # page such as the API reference lands on the right section.
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    # Selecting a tab in one tabbed block selects the same label everywhere.
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Get started:
    - Install and fit a model: getting-started.md
  - Guides:
    - Building models:
      - Custom graph models: custom-models.md
      - Use a model from Rust: native-models.md
    - Forecasting:
      - Evaluation and workflows: forecasting-workflows.md
      - Structural composition: structural-forecasting.md
      - Regression and calendar seasonality: regression-forecasting.md
      - Dynamic counts, amounts, and pooling: dynamic-glm.md
      - Independent batches and diagnostics: forecast-batches.md
      - Sparse amounts: sparse-amounts.md
      - Payment-count runoff: runoff.md
  # Every page below is generated by scripts/build_example_docs.py from the
  # example of the same name, and CI fails if one drifts. Order runs from the
  # smallest complete fit to the ones that add pooling, then scale.
  - Examples:
    - Linear regression: examples/simple-example.md
    - Repeated calibration: examples/repeated-calibration.md
    - Hierarchical models: examples/hierarchical-example.md
    - Hierarchical templates: examples/partial-pooling-template.md
    - Site effects: examples/site-effects.md
    - Batch inference: examples/batch-inference.md
    - High-dimensional regression: examples/large-linear-regression.md
  - API reference: reference.md
  - Project:
    - Architecture:
      - Compiled models: architecture/compiled-model.md
    - Statistical release checks: statistical-validation.md
    - Releasing: releasing.md
    - Contributing: https://github.com/tbosier/rustmc/blob/main/CONTRIBUTING.md
    - Benchmark protocol: https://github.com/tbosier/rustmc/blob/main/benchmarks/README.md

# The site has shipped orphan pages before: a file under docs/ that no nav entry
# reached, and a nav entry pointing at a file that had been renamed.
#
# `strict` lives here rather than on the command line on purpose. `gh-deploy`
# does accept --strict, but the deploy workflow runs `mkdocs gh-deploy --force`
# without it, and that workflow is not editable from this branch. Setting it
# here makes every warning below fail the build wherever it runs, including in
# the job that actually publishes the site, and it cannot be dropped by
# someone editing a command line later.
strict: true

# `error` is not an accepted value for the nav sub-options; `warn` plus the
# `strict` above is how they fail the build. A page that genuinely belongs
# outside the nav goes in `exclude_docs`, rather than relaxing these.
validation:
  nav:
    omitted_files: warn      # a page exists under docs/ but no nav entry reaches it
    not_found: warn          # a nav entry points at a file that is not there
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

# Internal review notes that live in some working trees but are not in git and
# never reach CI. CONTRIBUTING.md keeps them out of the repository; excluding
# them here keeps a local `mkdocs build --strict` honest without anyone having
# to move them aside first. Nothing published is excluded.
exclude_docs: |
  *.local.md
  forecasting-extension-review.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tbosier/rustmc
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/rustmc
