name: Deploy Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install docs dependencies
        # Install the checked-out package, not the latest PyPI release, so the
        # example pages are rebuilt against the API being documented.
        run: python -m pip install . mkdocs-material

      # docs/examples/*.md is generated from examples/*.py and committed, and CI
      # fails on drift, so this rebuild should be a no-op. Deploying a rebuild
      # rather than the committed copy means a page can never be published with
      # output the current code does not produce.
      - name: Rebuild the example pages from the examples
        run: python scripts/build_example_docs.py

      - run: mkdocs gh-deploy --force
