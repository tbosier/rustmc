name: Deploy Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install docs dependencies
        # Install the checked-out package, not the latest PyPI release, so
        # executable notebooks always validate the API being documented.
        # The notebooks use ArviZ 0.x plotting names; ArviZ 1.x export
        # compatibility is exercised separately by the Python 3.12 CI job.
        run: python -m pip install . mkdocs-material jupyter nbconvert "arviz>=0.20,<1" matplotlib

      - name: Convert notebooks to markdown
        run: |
          jupyter nbconvert --to markdown --execute \
            --ExecutePreprocessor.timeout=300 \
            --output-dir docs/examples \
            docs/examples/linear-regression.ipynb \
            docs/examples/hierarchical.ipynb

      - run: mkdocs gh-deploy --force
