name: Docs

# The site describes the released package, so it deploys only as the last step
# of a release (ci.yml calls this workflow after PyPI publishing succeeds), or by
# hand from a release tag to redeploy. It never deploys from main: a site built
# from main documents behaviour that PyPI does not have yet. Pull requests and
# main still build it, without deploying, so a broken page is caught before
# release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the site (the run must be on a vX.Y.Z tag)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install docs dependencies
        # Install the checked-out package, not the latest PyPI release, so the
        # example pages are rebuilt against the API being documented.
        run: python -m pip install . mkdocs-material

      # docs/examples/*.md is generated from examples/*.py and committed. Verify
      # rather than regenerate: a regenerating deploy would quietly publish
      # numbers nobody reviewed, and would hide from this workflow exactly the
      # drift that CI is meant to stop. What ships is the reviewed committed page,
      # and the deploy fails if it no longer matches the code that produced it.
      - name: Verify the example pages match the examples
        run: python scripts/build_example_docs.py --check

      # `strict: true` in mkdocs.yml makes any warning fail this step.
      - run: mkdocs build

  deploy:
    name: Deploy site
    needs: build
    # `inputs` is empty on push and pull_request, so only a release (through
    # workflow_call) or a manual run can deploy, and only from a release tag.
    if: inputs.deploy && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pages were checked against the package in `build`; deploying needs
      # only mkdocs, which regenerates nothing.
      - run: python -m pip install mkdocs-material

      - run: mkdocs gh-deploy --force
