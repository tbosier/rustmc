name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify synchronized package/dependency/lock versions
        run: python3 scripts/verify_version.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Statistical recovery tests exercise thousands of gradient evaluations;
      # run them with production arithmetic/code generation.
      - run: cargo test --workspace --release
      - name: Verify publishable Rust crate archive
        run: cargo package -p rustmc_core --locked

  python-source-install:
    name: Python source install (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Add macos-latest / windows-latest here once someone has verified
        # the steps below on those platforms (see CONTRIBUTING.md).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated test environment
        run: python -m venv "${{ runner.temp }}/source-env"
      - name: Install build and test dependencies
        run: "${{ runner.temp }}/source-env/bin/python -m pip install maturin numpy pytest"
      - name: maturin develop (editable source install)
        env:
          VIRTUAL_ENV: ${{ runner.temp }}/source-env
        run: "${{ runner.temp }}/source-env/bin/maturin develop --release --manifest-path python_bindings/Cargo.toml"
      - name: Install ArviZ 0.x integration dependency
        if: matrix.python-version == '3.11'
        run: "${{ runner.temp }}/source-env/bin/python -m pip install 'arviz>=0.20,<1'"
      - name: Install ArviZ 1.x integration dependency
        if: matrix.python-version == '3.12'
        run: "${{ runner.temp }}/source-env/bin/python -m pip install 'arviz>=1,<2'"
      - name: Build standalone model runtime example
        if: matrix.python-version == '3.11'
        run: cargo build -p rustmc_core --release --example load_model
      - name: Compare Python and standalone Rust model execution
        if: matrix.python-version == '3.11'
        env:
          RUSTMC_NATIVE_ARTIFACT_EXAMPLE: ${{ github.workspace }}/target/release/examples/load_model
        run: ${{ runner.temp }}/source-env/bin/python -m pytest -q tests/test_native_artifact_runtime.py
      - name: Verify current-source provenance and Python integration
        env:
          RUSTMC_REQUIRE_SOURCE_ROOT: ${{ github.workspace }}
        run: ${{ runner.temp }}/source-env/bin/python -m pytest -q tests

  python-wheel-install:
    name: Python wheel install (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Add macos-latest / windows-latest here once someone has verified
        # the steps below on those platforms (see CONTRIBUTING.md).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install maturin
      - name: Build wheel
        run: maturin build --release --manifest-path python_bindings/Cargo.toml --out dist
      - name: Create clean environment outside the checkout
        run: python -m venv "${{ runner.temp }}/wheel-env"
      - name: Install wheel and test dependencies into the clean environment
        shell: bash
        run: |
          WHEEL=$(ls dist/rustmc-*.whl | head -1)
          "${{ runner.temp }}/wheel-env/bin/python" -m pip install "$WHEEL" numpy pytest
      - name: Verify wheel provenance and full Python integration
        working-directory: ${{ runner.temp }}
        env:
          RUSTMC_REQUIRE_SITE_PACKAGES: "1"
        run: >-
          ${{ runner.temp }}/wheel-env/bin/python -m pytest -q
          ${{ github.workspace }}/tests

  version-check:
    name: Release versions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_version.py

  build:
    name: Build wheel (${{ matrix.target }})
    # A tag must not reach the publish path unless both source installs and
    # clean-wheel installs passed across the advertised Python matrix.
    needs: [version-check, python-source-install, python-wheel-install]
    # Exercise the release platforms before merging, as well as on release tags.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path python_bindings/Cargo.toml -i python3.11
          manylinux: auto
      # Test this exact platform artifact, then upload the same file.
      - name: Verify release wheel in a clean native environment
        run: python scripts/test_release_artifact.py wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: [version-check, python-source-install, python-wheel-install]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python_bindings/Cargo.toml
      - name: Verify release source archive in a clean environment
        run: python scripts/test_release_artifact.py sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
