name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify synchronized package/dependency/lock versions
        run: python3 scripts/verify_version.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Statistical recovery tests exercise thousands of gradient evaluations;
      # run them with production arithmetic/code generation.
      - run: cargo test --workspace --release
      # Ignored by default because it fits 4 x 2000 draws; with the release
      # build above already in place it adds well under a minute.
      - name: Run the ignored realistic-settings prediction test
        run: cargo test --release -p rustmc_core --test prediction_streams -- --ignored
      - name: Verify publishable Rust crate archive
        run: cargo package -p rustmc_core --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust_core/Cargo.toml is the single source of truth for the MSRV.
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust_core/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p rustmc_core --locked

  python-source-install:
    name: Python source install (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # Add macos-latest / windows-latest here once someone has verified
        # the steps below on those platforms (see CONTRIBUTING.md).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: py${{ matrix.python-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated test environment
        run: python -m venv "${{ runner.temp }}/source-env"
      - name: Install build and test dependencies
        run: "${{ runner.temp }}/source-env/bin/python -m pip install maturin numpy pytest"
      - name: maturin develop (editable source install)
        env:
          VIRTUAL_ENV: ${{ runner.temp }}/source-env
        run: "${{ runner.temp }}/source-env/bin/maturin develop --release --manifest-path python_bindings/Cargo.toml"
      - name: Install ArviZ 0.x integration dependency
        if: matrix.python-version == '3.11'
        run: "${{ runner.temp }}/source-env/bin/python -m pip install 'arviz>=0.20,<1'"
      - name: Install ArviZ 1.x integration dependency
        if: matrix.python-version == '3.12'
        run: "${{ runner.temp }}/source-env/bin/python -m pip install 'arviz>=1,<2'"
      - name: Build standalone model runtime example
        if: matrix.python-version == '3.11'
        run: cargo build -p rustmc_core --release --example load_model
      - name: Compare Python and standalone Rust model execution
        if: matrix.python-version == '3.11'
        env:
          RUSTMC_NATIVE_ARTIFACT_EXAMPLE: ${{ github.workspace }}/target/release/examples/load_model
        run: ${{ runner.temp }}/source-env/bin/python -m pytest -q tests/test_native_artifact_runtime.py
      - name: Verify current-source provenance and Python integration
        env:
          RUSTMC_REQUIRE_SOURCE_ROOT: ${{ github.workspace }}
        run: ${{ runner.temp }}/source-env/bin/python -m pytest -q tests
      # Deselected from the default run by pyproject.toml because it needs the
      # network: builds a wheel with maturin, installs it into a fresh venv with
      # pip, and imports it from outside the checkout.
      - name: Install the built wheel into a clean venv (network-marked test)
        if: matrix.python-version == '3.11'
        run: ${{ runner.temp }}/source-env/bin/python -m pytest -q -m network tests/test_packaging.py
      # Nothing ran the examples before, so two of them grew to ~57 and ~42
      # minutes and drifted out of examples/README.md unnoticed. The README
      # tables are the manifest; a script in neither a table nor an excluded
      # section fails this step.
      - name: Run every documented example under a time budget
        if: matrix.python-version == '3.11'
        run: >-
          ${{ runner.temp }}/source-env/bin/python scripts/run_examples.py
          --timeout 180 --jobs 2
      # docs/examples/*.md is generated from the examples and shows their real
      # output. Committed executed notebooks went stale here before: a page
      # advertised 128 divergent transitions for a model that now has none. This
      # step regenerates the pages and fails if any committed page disagrees.
      - name: Check the example pages still match the examples
        if: matrix.python-version == '3.11'
        run: >-
          ${{ runner.temp }}/source-env/bin/python scripts/build_example_docs.py --check
      - name: Check reference posteriors and repeated simulations
        if: matrix.python-version == '3.11'
        run: >-
          ${{ runner.temp }}/source-env/bin/python -m benchmarks.validate_posteriors
          --replicates 32 --output "${{ runner.temp }}/posterior-validation.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.11'
        with:
          name: posterior-validation
          path: ${{ runner.temp }}/posterior-validation.json

  python-wheel-install:
    name: Python wheel install (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # Add macos-latest / windows-latest here once someone has verified
        # the steps below on those platforms (see CONTRIBUTING.md).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: py${{ matrix.python-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install maturin
      - name: Build wheel
        run: maturin build --release --manifest-path python_bindings/Cargo.toml --out dist
      - name: Create clean environment outside the checkout
        run: python -m venv "${{ runner.temp }}/wheel-env"
      - name: Install wheel and test dependencies into the clean environment
        shell: bash
        run: |
          WHEEL=$(ls dist/rustmc-*.whl | head -1)
          "${{ runner.temp }}/wheel-env/bin/python" -m pip install "$WHEEL" numpy pytest
      - name: Verify wheel provenance and full Python integration
        working-directory: ${{ runner.temp }}
        env:
          RUSTMC_REQUIRE_SITE_PACKAGES: "1"
        run: >-
          ${{ runner.temp }}/wheel-env/bin/python -m pytest -q
          ${{ github.workspace }}/tests

  version-check:
    name: Release versions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_version.py

  build:
    name: Build wheel (${{ matrix.target }})
    # A tag must not reach the publish path unless both source installs and
    # clean-wheel installs passed across the advertised Python matrix.
    needs: [version-check, python-source-install, python-wheel-install]
    # Exercise the release platforms before merging, as well as on release tags.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path python_bindings/Cargo.toml -i python3.11
          manylinux: auto
      # Test this exact platform artifact, then upload the same file.
      - name: Verify release wheel in a clean native environment
        run: python scripts/test_release_artifact.py wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: [version-check, python-source-install, python-wheel-install]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path python_bindings/Cargo.toml
      - name: Verify release source archive in a clean environment
        run: python scripts/test_release_artifact.py sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # crates.io first, then PyPI, from the same tag. Nothing technical forces the
  # order (the wheels and sdist carry rustmc_core's source), but publishing one
  # registry by hand and the other from CI is how a version ends up on only one
  # of them. The crate goes first because `cargo publish` builds the packaged crate
  # once more before uploading, so a failure there stops the release before
  # anything is public.
  # If the PyPI job fails after the crate published, re-run that failed job
  # alone; re-running publish-crate fails, since the version already exists.
  publish-crate:
    name: Publish rustmc_core to crates.io
    needs: [build, sdist, msrv]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in the repository
    # settings; CARGO_REGISTRY_TOKEN is an environment secret (docs/releasing.md).
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-24
      - name: Verify the tag matches the manifests
        run: python3 scripts/verify_version.py
      - run: cargo publish -p rustmc_core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish:
    name: Publish to PyPI
    needs: [build, sdist, publish-crate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate every upload; PyPI's trusted
    # publisher entry can also be restricted to it (docs/releasing.md).
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
