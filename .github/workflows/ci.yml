name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  python-source-install:
    name: Python source install (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Add macos-latest / windows-latest here once someone has verified
        # the steps below on those platforms (see CONTRIBUTING.md).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create isolated test environment
        run: python -m venv "${{ runner.temp }}/source-env"
      - name: Install build and test dependencies
        run: "${{ runner.temp }}/source-env/bin/python -m pip install maturin numpy pytest"
      - name: maturin develop (editable source install)
        run: "${{ runner.temp }}/source-env/bin/maturin develop --release --manifest-path python_bindings/Cargo.toml"
      - name: Verify current-source provenance and Python integration
        env:
          RUSTMC_REQUIRE_SITE_PACKAGES: "1"
        run: >-
          ${{ runner.temp }}/source-env/bin/python -m pytest -q
          tests/test_smoke.py tests/test_param_resolution.py
          tests/test_binding_correctness.py tests/test_packaging.py

  python-wheel-install:
    name: Python wheel install (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Add macos-latest / windows-latest here once someone has verified
        # the steps below on those platforms (see CONTRIBUTING.md).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install maturin
      - name: Build wheel
        run: maturin build --release --manifest-path python_bindings/Cargo.toml --out dist
      - name: Create clean environment outside the checkout
        run: python -m venv "${{ runner.temp }}/wheel-env"
      - name: Install wheel and test dependencies into the clean environment
        shell: bash
        run: |
          WHEEL=$(ls dist/rustmc-*.whl | head -1)
          "${{ runner.temp }}/wheel-env/bin/python" -m pip install "$WHEEL" numpy pytest
      - name: Verify wheel provenance and full Python integration
        working-directory: ${{ runner.temp }}
        env:
          RUSTMC_REQUIRE_SITE_PACKAGES: "1"
        run: >-
          ${{ runner.temp }}/wheel-env/bin/python -m pytest -q
          ${{ github.workspace }}/tests/test_smoke.py
          ${{ github.workspace }}/tests/test_param_resolution.py
          ${{ github.workspace }}/tests/test_binding_correctness.py
          ${{ github.workspace }}/tests/test_packaging.py

  version-check:
    name: Version matches tag
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          for f in rust_core/Cargo.toml python_bindings/Cargo.toml pyproject.toml; do
            V=$(grep '^version = ' "$f" | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
            if [ "$V" != "$EXPECTED" ]; then
              echo "::error::$f has version $V but tag is $TAG (expected $EXPECTED)"
              exit 1
            fi
          done
          echo "Version $EXPECTED matches tag $TAG"

  build:
    name: Build wheel (${{ matrix.target }})
    needs: version-check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path python_bindings/Cargo.toml -i python3.9
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: version-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python_bindings/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
